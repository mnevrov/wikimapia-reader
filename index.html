<!doctype html>
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <style>html{background:#000;color-scheme:dark}html[data-theme="light"]{background:#e3e9ef;color-scheme:light}</style>
    <script>
      try {
        const preference = localStorage.getItem('wikimapia-reader-theme');
        const light = preference === 'light' || (preference === 'system' && !matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = light ? 'light' : 'dark';
        document.querySelector('meta[name="theme-color"]').content = light ? '#ffffff' : '#000000';
      } catch {}
    </script>
    <title>Wikimapia Reader — прототип</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
