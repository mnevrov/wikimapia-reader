name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (vX.Y.Z); leave empty for build only. Run from main.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Probe validation tests (offline)
        run: npm run test:probe
      - run: npx playwright install --with-deps chromium
      - name: Build web assets and sync Android
        run: npm run android:sync
      - name: Mobile browser tests (mock API)
        run: npx playwright test
      - name: Build and lint APK
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug lintDebug
      - name: Checksum
        working-directory: android/app/build/outputs/apk/debug
        run: sha256sum app-debug.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: WikiReader-debug-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/SHA256SUMS.txt
          retention-days: 14
          if-no-files-found: error

      - name: Require a release commit from main
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          if [[ "$EVENT_NAME" == workflow_dispatch && "$SOURCE_REF" != refs/heads/main ]]; then
            echo 'Manual releases must run from main'; exit 1
          fi
          git merge-base --is-ancestor HEAD origin/main
      - name: Sign and verify Next release APK
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
          NEXT_KEYSTORE_BASE64: ${{ secrets.NEXT_KEYSTORE_BASE64 }}
          NEXT_STORE_PASSWORD: ${{ secrets.NEXT_STORE_PASSWORD }}
          NEXT_KEY_PASSWORD: ${{ secrets.NEXT_KEY_PASSWORD }}
        run: bash scripts/prepare-release.sh "$RELEASE_TAG"
      - name: Retain signed release files
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: WikiReader-release-${{ github.sha }}
          path: release-dist/
          retention-days: 14
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: verify-and-build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Download verified signed files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          ARTIFACT_NAME: WikiReader-release-${{ github.sha }}
        run: gh run download "$RUN_ID" --name "$ARTIFACT_NAME" --dir release-dist
      - name: Publish release and verify downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
          RELEASE_TARGET_SHA: ${{ github.sha }}
        run: bash scripts/publish-release.sh "$RELEASE_TAG"
