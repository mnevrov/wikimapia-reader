// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        // Restricted fallback for a 56 MB Kotlin artifact: Maven Central intermittently
        // redirects to GitHub Releases and fails with HTTP 504 on clean CI runners.
        // Scope tightly to the one module; all other artifacts remain on trusted defaults.
        maven {
            url 'https://maven.wso2.org/nexus/content/repositories/central/'
            content { includeModule 'org.jetbrains.kotlin', 'kotlin-compiler-embeddable' }
        }
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
